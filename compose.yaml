services:
  birthmasbot:
    image: birthmasbot
    build:
      context: .
      dockerfile: Birthmas.Bot/Dockerfile
    environment:
      - DiscordServerId=${DiscordServerId}
      - ErrorChannelId=${ErrorChannelId}
      - AnnouncementChannelId=${AnnouncementChannelId}
      - BirthdayRoleId=${BirthdayRoleId}
      - DbHost=${DbHost}
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
      - DbName=${DbName}
      - DbUser=${DbUser}
      - DbPassword=${DbPassword}
      - BotToken=${BotToken}